<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontaktnätet</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-api-base="http://127.0.0.1:4000">
">
    <header class="navbar navbar-light bg-white shadow-sm sticky-top">
      <nav class="container d-flex flex-wrap align-items-center justify-content-between py-3">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
          <span class="brand-icon">☕</span>
          Kontaktnätet
        </a>
        <div class="d-flex gap-3 align-items-center">
          <div id="authStatus" class="text-muted small"></div>
          <button id="logoutButton" class="btn btn-outline-secondary btn-sm d-none">Logga ut</button>
        </div>
      </nav>
    </header>

    <main class="container my-4">
      <div class="row g-4">
        <aside class="col-lg-4">
          <section class="card shadow-sm mb-4" id="authCard">
            <div class="card-body">
              <h2 class="h5 mb-3">Logga in</h2>
              <form id="loginForm" class="needs-validation" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="loginUsername">Användarnamn</label>
                  <input class="form-control" id="loginUsername" name="username" autocomplete="username" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="loginPassword">Lösenord</label>
                  <input
                    class="form-control"
                    id="loginPassword"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                  />
                </div>
                <button class="btn btn-primary w-100" type="submit">Logga in</button>
              </form>
              <hr class="my-4" />
              <h2 class="h5 mb-3">Registrera dig</h2>
              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label class="form-label" for="registerUsername">Användarnamn</label>
                  <input class="form-control" id="registerUsername" name="username" autocomplete="username" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="registerDisplayName">Visningsnamn</label>
                  <input class="form-control" id="registerDisplayName" name="displayName" maxlength="40" />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="registerPassword">Lösenord</label>
                  <input
                    class="form-control"
                    id="registerPassword"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <button class="btn btn-success w-100" type="submit">Skapa konto</button>
              </form>
            </div>
          </section>

          <section class="card shadow-sm mb-4 d-none" id="searchCard">
            <div class="card-body">
              <h2 class="h6 mb-3">Hitta användare</h2>
              <input
                id="searchInput"
                type="search"
                class="form-control"
                placeholder="Sök efter namn..."
                autocomplete="off"
              />
              <ul id="searchResults" class="list-group list-group-flush mt-3 small"></ul>
            </div>
          </section>

          <section class="card shadow-sm mb-4 d-none" id="requestsCard">
            <div class="card-body">
              <h2 class="h6 mb-3">Förfrågningar</h2>
              <p class="text-muted small mb-3">Nya vänförfrågningar visas här.</p>
              <ul id="requestsList" class="list-group list-group-flush small"></ul>
            </div>
          </section>

          <section class="card shadow-sm d-none" id="friendsCard">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h6 mb-0">Vänner</h2>
                <button id="showOwnWallBtn" class="btn btn-sm btn-outline-primary">Min sida</button>
              </div>
              <ul id="friendsList" class="list-group list-group-flush small"></ul>
            </div>
          </section>
        </aside>

        <section class="col-lg-8">
          <div id="messageArea" class="alert d-none" role="alert"></div>

          <section class="card shadow-sm d-none" id="wallCard">
            <div class="card-body">
              <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
                <div>
                  <h2 class="h4 mb-1" id="wallTitle"></h2>
                  <p class="text-muted mb-0" id="wallSubtitle"></p>
                </div>
              </header>

              <form id="postForm" class="mb-4">
                <div class="mb-3">
                  <label class="form-label" for="postMessage">Skriv meddelande</label>
                  <textarea
                    id="postMessage"
                    name="message"
                    class="form-control"
                    rows="3"
                    maxlength="140"
                    required
                  ></textarea>
                  <div class="d-flex justify-content-between mt-2 small text-muted">
                    <span id="postCounter">0 / 140 tecken</span>
                    <span>Trimmas automatiskt vid publicering.</span>
                  </div>
                </div>
                <button class="btn btn-primary" type="submit">Publicera</button>
              </form>

              <div id="postsEmpty" class="text-center text-muted py-4 d-none">
                Inga inlägg ännu.
              </div>
              <ul id="postsList" class="list-group list-group-flush"></ul>
            </div>
          </section>
        </section>
      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
